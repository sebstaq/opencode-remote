name: OpenCodeRemote
options:
  bundleIdPrefix: dev.sebstaq.opencode
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is supplied at build time (environment variable or
    # Doppler, see scripts in the repo) so it is not committed here.
packages:
  OpenCodeAPI:
    path: Packages/OpenCodeAPI
  SwiftStreamingMarkdown:
    url: https://github.com/microsoft/SwiftStreamingMarkdown
    # Revision pin (not a version range): upstream pins two of its own deps
    # to revisions, and SPM refuses stable-version roots over unstable deps.
    revision: 5f7c04e0558df6146f90d482edb62cb456986bda
targets:
  OpenCodeRemote:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: OpenCodeAPI
        product: OpenCodeAPI
      - package: SwiftStreamingMarkdown
        product: SwiftStreamingMarkdown
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: OpenCode Remote
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  OpenCodeRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
    dependencies:
      - target: OpenCodeRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.sebstaq.opencode.OpenCodeRemoteUITests
  OpenCodeRemoteIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/IntegrationTests
    dependencies:
      - package: OpenCodeAPI
        product: OpenCodeAPI
      - package: SwiftStreamingMarkdown
        product: SwiftStreamingMarkdown
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.sebstaq.opencode.OpenCodeRemoteIntegrationTests
  OpenCodeRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/UnitTests
    dependencies:
      - target: OpenCodeRemote
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.sebstaq.opencode.OpenCodeRemoteTests
schemes:
  OpenCodeRemote:
    build:
      targets:
        OpenCodeRemote: all
    test:
      targets:
        - OpenCodeRemoteTests
        - OpenCodeRemoteIntegrationTests
        - OpenCodeRemoteUITests
      environmentVariables:
        - variable: OPENCODE_E2E_URL
          value: $(OPENCODE_E2E_URL)
        - variable: OPENCODE_E2E_PASSWORD
          value: $(OPENCODE_E2E_PASSWORD)
        - variable: OPENCODE_E2E_EMPTY_URL
          value: $(OPENCODE_E2E_EMPTY_URL)
        - variable: OPENCODE_E2E_DOWN_URL
          value: $(OPENCODE_E2E_DOWN_URL)
        - variable: OPENCODE_PERMISSION_SHOTS
          value: $(OPENCODE_PERMISSION_SHOTS)
