name: lint

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Swift toolchain
        run: |
          xcode-select -p
          swift --version

      - name: Format lint (strict)
        run: |
          swift format lint --strict --recursive App Tests Packages/OpenCodeAPI/Package.swift

      - name: Theme guard (no loose colors outside Theme)
        run: |
          if grep -rnE "\.quaternary|\.thinMaterial|\.background\(\.bar\)|Color\(\.systemBackground\)|\.gray\.opacity|Color\(red:" App/Features App/Core; then
            echo "::error::Loose color found — use Theme.Color tokens (App/Core/Theme.swift)"
            exit 1
          fi
