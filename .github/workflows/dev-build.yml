name: dev-build

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: dev-build
  cancel-in-progress: false

# Signing follows GitHub's documented pattern for macOS runners: a persistent
# CI certificate (p12) and a development provisioning profile live as secrets
# in the dev-signing environment, are imported into a temporary keychain, and
# xcodebuild signs fully offline. No ASC API calls during the build —
# -allowProvisioningUpdates can stall indefinitely inside xcodebuild against
# the ASC API (30-60 min hangs, Sep 2026). Renewal: mint a new certificate or
# profile with the same names, refresh the two secrets.
# https://docs.github.com/actions/how-tos/deploy/deploy-to-third-party-platforms/sign-xcode-applications

jobs:
  build:
    runs-on: macos-26
    environment: dev-signing
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Import signing material
        env:
          CI_CERT_P12_BASE64: ${{ secrets.CI_CERT_P12_BASE64 }}
          CI_CERT_PASSWORD: ${{ secrets.CI_CERT_PASSWORD }}
          CI_PROFILE_BASE64: ${{ secrets.CI_PROFILE_BASE64 }}
          KC_PASS: ${{ runner.temp }}-kc
        run: |
          echo -n "$CI_CERT_P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/ci.p12"
          echo -n "$CI_PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KC_PASS" "$RUNNER_TEMP/ci.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/ci.keychain-db"
          security unlock-keychain -p "$KC_PASS" "$RUNNER_TEMP/ci.keychain-db"
          security import "$RUNNER_TEMP/ci.p12" -P "$CI_CERT_PASSWORD" -A -t cert -f pkcs12 \
            -k "$RUNNER_TEMP/ci.keychain-db"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" \
            "$RUNNER_TEMP/ci.keychain-db" >/dev/null
          security list-keychains -s "$RUNNER_TEMP/ci.keychain-db" $(security list-keychains | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Archive
        run: |
          xcodebuild \
            -project OpenCodeRemote.xcodeproj \
            -scheme OpenCodeRemote \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/OpenCodeRemote.xcarchive" \
            -skipPackagePluginValidation \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="opencode-remote development" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            archive
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}

      - name: Export IPA
        run: |
          PLIST="$RUNNER_TEMP/ExportOptions-CI.plist"
          cp scripts/ExportOptions-Dev.plist "$PLIST"
          plutil -replace signingStyle -string manual "$PLIST"
          plutil -insert provisioningProfiles -xml \
            '<dict><key>dev.sebstaq.opencode.OpenCodeRemote</key><string>opencode-remote development</string></dict>' \
            "$PLIST"
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/OpenCodeRemote.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$PLIST"
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then ls -la "$RUNNER_TEMP/export"; exit 1; fi
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: Upload to Diawi
        run: |
          python3 scripts/ui/diawi.py "$IPA" > "$RUNNER_TEMP/diawi.log"
          URL=$(sed -n 's/^DIAWI_URL=//p' "$RUNNER_TEMP/diawi.log")
          if [ -z "$URL" ]; then cat "$RUNNER_TEMP/diawi.log"; exit 1; fi
          {
            echo "### Diawi"
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Diawi link: $URL"
          echo "uploaded: $IPA"
        env:
          DIAWI_TOKEN: ${{ secrets.DIAWI_TOKEN }}

      - name: Cleanup secrets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/ci.p12" "$RUNNER_TEMP/profile.mobileprovision" \
            ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
