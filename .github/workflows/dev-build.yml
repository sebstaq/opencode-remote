name: dev-build

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    environment: dev-signing
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # The signing identity never lives in a secret: each run generates a
      # throwaway key on the runner, has Apple issue an Apple Development
      # certificate for it via the ASC API (the only stored credential),
      # signs the IPA, and deletes everything afterwards. Apple allows two
      # development certificates per team, so every run first retires
      # certificates issued by previous CI runs, keeping only the oldest
      # (the pre-existing certificate used outside of CI). Revoking the old
      # CI certificate also invalidates previous dev builds' profiles, which
      # is expected for ephemeral dev builds.

      - name: Prepare ASC key
        run: |
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/asc.p8"
          chmod 600 "$RUNNER_TEMP/asc.p8"
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}

      - name: Mint ASC API token
        run: |
          cat > "$RUNNER_TEMP/jwt.py" <<'PY'
          import base64, json, subprocess, time, os
          kid = os.environ["ASC_KEY_ID"]
          iss = os.environ["ASC_ISSUER_ID"]
          p8 = os.path.join(os.environ["RUNNER_TEMP"], "asc.p8")
          def b64(b):
              return base64.urlsafe_b64encode(b).rstrip(b"=").decode()
          header = b64(json.dumps({"alg": "ES256", "kid": kid, "typ": "JWT"}).encode())
          now = int(time.time())
          payload = b64(json.dumps({"iss": iss, "iat": now, "exp": now + 1200, "aud": "appstoreconnect-v1"}).encode())
          signing = (header + "." + payload).encode()
          p = subprocess.run(["openssl", "dgst", "-sha256", "-sign", p8], input=signing, capture_output=True)
          if p.returncode != 0:
              raise SystemExit(p.stderr.decode())
          der = p.stdout
          # DER ECDSA-Sig-Value -> raw r||s (JWT ES256 wants P1363)
          i = 2
          r_len = der[i + 1]
          r = der[i + 2:i + 2 + r_len]
          j = i + 2 + r_len
          s_len = der[j + 1]
          s = der[j + 2:j + 2 + s_len]
          r = r.lstrip(b"\x00").rjust(32, b"\x00")
          s = s.lstrip(b"\x00").rjust(32, b"\x00")
          token = header + "." + payload + "." + b64(r + s)
          open(os.path.join(os.environ["RUNNER_TEMP"], "asc.token"), "w").write(token)
          PY
          python3 "$RUNNER_TEMP/jwt.py"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      - name: Retire previous CI certificates (keep the oldest)
        run: |
          TOKEN=$(cat "$RUNNER_TEMP/asc.token")
          for i in 1 2 3; do
            curl -g -sS --retry 3 --retry-all-errors --connect-timeout 8 \
              -H "Authorization: Bearer $TOKEN" \
              "https://api.appstoreconnect.apple.com/v1/certificates?filter[certificateType]=DEVELOPMENT&limit=200" \
              > "$RUNNER_TEMP/certs.json" && break || sleep $((i*3))
          done
          jq -e '.data' "$RUNNER_TEMP/certs.json" >/dev/null || { cat "$RUNNER_TEMP/certs.json"; exit 1; }
          # keep the oldest certificate (used outside CI); delete the rest
          jq -r '.data | sort_by(.attributes.createdDate) | reverse | .[1:][]?.id' "$RUNNER_TEMP/certs.json" > "$RUNNER_TEMP/retire.txt"
          while read -r ID; do
            [ -z "$ID" ] && continue
            curl -sS -X DELETE -H "Authorization: Bearer $TOKEN" \
              "https://api.appstoreconnect.apple.com/v1/certificates/$ID" -o /dev/null
            echo "retired CI certificate $ID"
          done < "$RUNNER_TEMP/retire.txt"

      - name: Generate key and certificate
        run: |
          TOKEN=$(cat "$RUNNER_TEMP/asc.token")
          cd "$RUNNER_TEMP"
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out ci.key 2>/dev/null
          openssl req -new -key ci.key -subj "/CN=opencode-remote-ci" -out ci.csr
          CSR=$(sed -e '/^-----/d' ci.csr | tr -d '\n')
          curl -sS -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "https://api.appstoreconnect.apple.com/v1/certificates" \
            -d '{"data":{"type":"certificates","attributes":{"certificateType":"DEVELOPMENT","csrContent":"'"$CSR"'"}}}' \
            > cert-response.json
          jq -e '.data.attributes.certificateContent' cert-response.json > /dev/null \
            || { cat cert-response.json; exit 1; }
          jq -r '.data.attributes.certificateContent' cert-response.json | base64 -d > dev.cer
          (openssl x509 -in dev.cer -inform PEM -out devcert.pem 2>/dev/null \
            || openssl x509 -in dev.cer -inform DER -out devcert.pem)
          openssl pkcs12 -export -inkey ci.key -in devcert.pem \
            -name "Apple Development" -out ci.p12 -passout pass:"$KC_PASS" \
            -macalg sha1 -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES
          echo "certificate minted: $(openssl x509 -in devcert.pem -noout -subject)"
        env:
          KC_PASS: ${{ runner.temp }}-kc

      - name: Import into temporary keychain
        run: |
          cd "$RUNNER_TEMP"
          security create-keychain -p "$KC_PASS" ci.keychain-db
          security unlock-keychain -p "$KC_PASS" ci.keychain-db
          curl -sS -o AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import AppleWWDRCAG3.cer -k ci.keychain-db -A
          security import ci.p12 -k ci.keychain-db -P "$KC_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" ci.keychain-db >/dev/null
          security list-keychains -s "$HOME/Library/Keychains/ci.keychain-db" $(security list-keychains | tr -d '"')
        env:
          KC_PASS: ${{ runner.temp }}-kc

      # xcodebuild with -allowProvisioningUpdates can stall indefinitely against
      # the ASC API (observed twice, 20+ min in Archive); the watchdog turns the
      # stall into a failure so the retry loop gets a fresh chance.
      - name: Archive
        run: |
          run_archive() {
            xcodebuild \
              -project OpenCodeRemote.xcodeproj \
              -scheme OpenCodeRemote \
              -configuration Debug \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/OpenCodeRemote.xcarchive" \
              -skipPackagePluginValidation \
              -skipMacroValidation \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
              archive
          }
          success=""
          for attempt in 1 2; do
            echo "archive attempt $attempt"
            run_archive &
            xpid=$!
            ( sleep 900; echo "archive was silent for 15 min, killing it"; kill -9 "$xpid" 2>/dev/null ) &
            watchdog=$!
            if wait "$xpid"; then
              success="yes"
            fi
            kill "$watchdog" 2>/dev/null || true
            if [ -n "$success" ]; then break; fi
            echo "archive attempt $attempt failed"
            sleep 15
          done
          [ -n "$success" ] || { echo "archive failed on both attempts"; exit 1; }
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      - name: Export IPA
        run: |
          run_export() {
            xcodebuild \
              -exportArchive \
              -archivePath "$RUNNER_TEMP/OpenCodeRemote.xcarchive" \
              -exportPath "$RUNNER_TEMP/export" \
              -exportOptionsPlist scripts/ExportOptions-Dev.plist \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          }
          success=""
          for attempt in 1 2; do
            echo "export attempt $attempt"
            run_export &
            xpid=$!
            ( sleep 300; echo "export was silent for 5 min, killing it"; kill -9 "$xpid" 2>/dev/null ) &
            watchdog=$!
            if wait "$xpid"; then
              success="yes"
            fi
            kill "$watchdog" 2>/dev/null || true
            if [ -n "$success" ]; then break; fi
            echo "export attempt $attempt failed"
            sleep 10
          done
          [ -n "$success" ] || { echo "export failed on both attempts"; exit 1; }
          IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then ls -la "$RUNNER_TEMP/export"; exit 1; fi
          echo "IPA=$IPA" >> "$GITHUB_ENV"
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      - name: Upload to Diawi
        run: |
          python3 scripts/ui/diawi.py "$IPA" > "$RUNNER_TEMP/diawi.log"
          URL=$(sed -n 's/^DIAWI_URL=//p' "$RUNNER_TEMP/diawi.log")
          if [ -z "$URL" ]; then cat "$RUNNER_TEMP/diawi.log"; exit 1; fi
          {
            echo "### Diawi"
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Diawi link: $URL"
          echo "uploaded: $IPA"
        env:
          DIAWI_TOKEN: ${{ secrets.DIAWI_TOKEN }}

      - name: Cleanup secrets
        if: always()
        run: |
          security delete-keychain ci.keychain-db 2>/dev/null || true
          rm -f "$RUNNER_TEMP/asc.p8" "$RUNNER_TEMP/asc.token" "$RUNNER_TEMP/ci.key" \
                "$RUNNER_TEMP/ci.csr" "$RUNNER_TEMP/ci.p12" "$RUNNER_TEMP/dev.cer" \
                "$RUNNER_TEMP/devcert.pem" "$RUNNER_TEMP/cert-response.json"
        env:
          DIAWI_TOKEN: ''
