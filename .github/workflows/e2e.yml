name: e2e

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-slim
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - 'App/**'
              - 'Tests/**'
              - 'Packages/**'
              - 'project.yml'
              - 'Makefile'
              - 'scripts/**'

  e2e:
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Install OpenCode (fixture server)
        run: npm install -g opencode-ai

      - name: Start fixture server
        run: |
          OPENCODE_FIXTURE_PORT=4097 nohup scripts/serve-fixture.sh >/tmp/fixture.log 2>&1 &
          code=""
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' -m 2 http://127.0.0.1:4097/global/health || true)"
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" != "200" ]; then
            cat /tmp/fixture.log
            exit 1
          fi

      - name: UI tests (offline suites)
        env:
          OPENCODE_E2E_EMPTY_URL: http://127.0.0.1:4097
          OPENCODE_E2E_DOWN_URL: http://127.0.0.1:4999
        run: |
          scripts/ui-tests.sh 'iPhone 17' \
            -only-testing:OpenCodeRemoteUITests/SessionsOfflineE2ETests
